# Builds the Windows installer (Inno Setup needs Windows) and attaches it to the release.
name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (e.g. v1.7.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test
        run: dotnet test tests/RetroHub.Core.Tests -c Release --nologo
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem dist\RetroHub-Setup-*.exe).FullName --clobber
